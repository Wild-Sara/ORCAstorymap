<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bat Telemetry Flight Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  html, body { margin:0; padding:0; height:100%; background:#15140f; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  #map { width:100%; height:100vh; background:#15140f; }
  .leaflet-container { background:#15140f; }

  .receiver-icon, .capture-icon { filter: drop-shadow(0 0 3px rgba(0,0,0,0.6)); }

  .site-label {
    color: #e8e2d4;
    font-size: 12px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.9);
    white-space: nowrap;
    pointer-events: none;
    letter-spacing: 0.02em;
  }

  .bat-marker {
    pointer-events: none;
    transition: opacity 0.35s ease;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,0.7));
  }

  .legend {
    position: absolute; bottom: 16px; left: 16px;
    background: rgba(21, 20, 15, 0.88);
    border: 1px solid rgba(232, 226, 212, 0.15);
    border-radius: 6px; padding: 12px 16px;
    color: #e8e2d4; font-size: 12.5px; line-height: 1.7;
    z-index: 1000; backdrop-filter: blur(3px); max-width: 230px;
  }
  .legend-row { display:flex; align-items:center; gap:8px; }
  .legend-swatch { width:20px; height:14px; flex-shrink:0; object-fit:contain; }
  .legend-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.55; margin-bottom: 6px; margin-top: 10px; }
  .legend-title:first-child { margin-top: 0; }

  .clock {
    position: absolute; top: 16px; left: 16px;
    background: rgba(21, 20, 15, 0.88);
    border: 1px solid rgba(232, 226, 212, 0.15);
    border-radius: 6px; padding: 8px 14px;
    color: #e8e2d4; font-size: 13px; z-index: 1000;
    font-variant-numeric: tabular-nums; backdrop-filter: blur(3px);
  }
  .clock .date { opacity: 0.6; font-size: 11px; }

  .signal-note {
    position: absolute; bottom: 16px; right: 16px;
    background: rgba(21, 20, 15, 0.88);
    border: 1px solid rgba(232, 226, 212, 0.15);
    border-radius: 6px; padding: 10px 14px;
    color: #e8e2d4; font-size: 11.5px; line-height: 1.5;
    z-index: 1000; max-width: 190px; backdrop-filter: blur(3px);
  }
</style>
</head>

// ---------- Bat icons (per-species aspect ratio preserved) ----------
const CUSTOM_ICONS = {
  "149": "silver_telemetry.svg",
  "160": "myotis_telemetry.svg",
  "163": "hoary_telemetry.svg"
};

const BAT_TARGET_WIDTH = 60;

function makeBatIcon(tag, species) {
  const aspect = DATA.icon_aspect[species] || 2.2;
  const w = BAT_TARGET_WIDTH;
  const h = w / aspect;

  return L.icon({
    iconUrl: CUSTOM_ICONS[tag] || DATA.icons[species],
    iconSize: [w, h],
    iconAnchor: [w*0.7, h*.2],
    className: 'bat-marker'
  });
}

const batMarkers = {};

Object.entries(DATA.bats).forEach(([tag, bat]) => {
  const startPos = bat.segments[0].from;

  const marker = L.marker(startPos, {
    icon: makeBatIcon(tag, bat.species),
    zIndexOffset: 500
  });

  marker.addTo(map);
  batMarkers[tag] = marker;

});

// ---------- Precompute cumulative timing per bat ----------
function prepBat(bat) {
  let t = 0;
  const segs = bat.segments.map(seg => {
    const s = Object.assign({}, seg, {t_start: t, t_end: t + seg.anim_dur});
    t += seg.anim_dur;
    return s;
  });
  const lastSeg = segs[segs.length - 1];
  const lastCoord = lastSeg.type === 'stay' ? lastSeg.at : lastSeg.to;
  const lastLabel = lastSeg.type === 'stay' ? lastSeg.location : (lastSeg.label_to || '');
  if (t < DATA.loop_seconds - 0.05) {
    segs.push({
      type: 'stay', at: lastCoord, location: lastLabel,
      anim_dur: DATA.loop_seconds - t, n_loops: Math.max(1, Math.round((DATA.loop_seconds-t)/1.4)),
      avg_signal: 45,
      t_start: t, t_end: DATA.loop_seconds
    });
  }
  return segs;
}
const prepped = {};
Object.entries(DATA.bats).forEach(([tag, bat]) => { prepped[tag] = prepBat(bat); });

// ---------- Helpers ----------
function lerp(a, b, f) { return a + (b - a) * f; }
function lerpCoord(c1, c2, f) { return [lerp(c1[0], c2[0], f), lerp(c1[1], c2[1], f)]; }
function bearing(c1, c2) {
  const toRad = d => d * Math.PI/180, toDeg = r => r*180/Math.PI;
  const lat1=toRad(c1[0]), lat2=toRad(c2[0]), dLon=toRad(c2[1]-c1[1]);
  const y = Math.sin(dLon)*Math.cos(lat2);
  const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
  return (toDeg(Math.atan2(y,x)) + 360) % 360;
}
function arcOffset(c1, c2, f) {
  const bulge = Math.sin(f * Math.PI) * 0.00028 * distApprox(c1,c2);
  const dx = c2[1]-c1[1], dy = c2[0]-c1[0];
  const len = Math.sqrt(dx*dx+dy*dy) || 1;
  const px = -dy/len, py = dx/len;
  return [py*bulge, px*bulge];
}
function distApprox(c1,c2){
  const dx=c2[1]-c1[1], dy=c2[0]-c1[0];
  return Math.sqrt(dx*dx+dy*dy) * 3000;
}
function loopRadius(avgSignal) {
  const s = Math.max(15, Math.min(75, avgSignal));
  const f = 1 - (s - 15) / (75 - 15);
  return 0.00035 + f * 0.0012;
}

const OFFSCREEN_LIFT = 0.028;

function positionForSegment(seg, tLocal) {
  const dur = seg.anim_dur || 0.0001;
  const f = Math.max(0, Math.min(1, tLocal / dur));
 if (seg.type === 'flight') {
  const base = lerpCoord(seg.from, seg.to, f);
  const off = arcOffset(seg.from, seg.to, f);

  const coord = [
    base[0] + off[0],
    base[1] + off[1]
  ];

  const nextF = Math.min(1, f + 0.02);

  const nextBase = lerpCoord(seg.from, seg.to, nextF);
  const nextOff = arcOffset(seg.from, seg.to, nextF);

  const nextCoord = [
    nextBase[0] + nextOff[0],
    nextBase[1] + nextOff[1]
  ];

  return {
    coord,
    angle: bearing(coord, nextCoord),
    opacity: 1
  };
}
  if (seg.type === 'stay') {
    const r = loopRadius(seg.avg_signal);
    const angle = f * seg.n_loops * Math.PI * 2;
    const wob = 1 + 0.15*Math.sin(f*seg.n_loops*Math.PI*6);
    const coord = [seg.at[0] + Math.sin(angle)*r*wob, seg.at[1] + Math.cos(angle)*r*wob*1.3];
    const headingCoord = [seg.at[0] + Math.sin(angle+0.25)*r*wob, seg.at[1] + Math.cos(angle+0.25)*r*wob*1.3];
    return { coord, angle: bearing(coord, headingCoord), opacity: 1 };
  }
  if (seg.type === 'offscreen') {
    if (f < 0.3) {
      const ff = f/0.3;
      const away = [seg.from[0]+OFFSCREEN_LIFT*ff, seg.from[1]];
      return { coord: away, angle: bearing(seg.from, [seg.from[0]+1, seg.from[1]]), opacity: 1-ff*0.9 };
    } else if (f < 0.7) {
      return { coord: [seg.from[0]+OFFSCREEN_LIFT, seg.from[1]], angle: 0, opacity: 0 };
    } else {
      const ff = (f-0.7)/0.3;
      const enter = [seg.to[0]+OFFSCREEN_LIFT*(1-ff), seg.to[1]];
      return { coord: enter, angle: bearing([seg.to[0]+1, seg.to[1]], seg.to), opacity: ff*0.9+0.1 };
    }
  }
  return { coord: seg.type==='flight'?seg.from:seg.at, angle: 0, opacity: 1 };
}

function findSegment(segs, t) {
  for (const s of segs) {
    if (t >= s.t_start && t < s.t_end) return s;
  }
  return segs[segs.length-1];
}

// ---------- Compressed clock ----------
const winStart = new Date(DATA.window_start);
const winEnd = new Date(DATA.window_end);
const winSpanMs = winEnd - winStart;
const clockTimeEl = document.getElementById('clockTime');
const clockDateEl = document.getElementById('clockDate');
function updateClock(loopFrac) {
  const simTime = new Date(winStart.getTime() + winSpanMs * loopFrac);
  clockTimeEl.textContent = simTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  clockDateEl.textContent = simTime.toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'});
}

// ---------- Animation loop ----------
const LOOP_MS = DATA.loop_seconds * 1800;
const t0 = performance.now();
requestAnimationFrame(function frame(now) {
  const elapsed = ((now - t0) % LOOP_MS) / 1000;
  updateClock(elapsed / DATA.loop_seconds);
  Object.entries(prepped).forEach(([tag, segs]) => {
    const seg = findSegment(segs, elapsed);
    const tLocal = elapsed - seg.t_start;
    const r = positionForSegment(seg, tLocal);
    const marker = batMarkers[tag];
marker.setLatLng(r.coord);


const el = marker.getElement();

if (el) {
  const rot = r.angle;   // or whatever value finally worked
  const existing = el.style.transform.replace(/\s*rotate\([^)]*\)/, '');
  el.style.transform = existing + ` rotate(${rot}deg)`;
  el.style.opacity = r.opacity;
}

});

requestAnimationFrame(frame);
});
